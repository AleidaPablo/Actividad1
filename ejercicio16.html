<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Números</title>
    <link rel="stylesheet" href="css/ejercicio16.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <div class="calculadora">
        <h2>Calculadora de Números</h2>

        <form id="formularioCalculadora" onsubmit="return false;">

            <div class="grupo-formulario">
                <label for="numero1">Primer número</label>
                <input type="text" id="numero1" placeholder="Escribe un número" autocomplete="off">
            </div>

            <div class="grupo-formulario">
                <label for="numero2">Segundo número</label>
                <input type="text" id="numero2" placeholder="Escribe un número" autocomplete="off">
            </div>

            <div class="botones">
                <button type="button" id="boton-suma">Sumar</button>
                <button type="button" id="boton-resta">Restar</button>
                <button type="button" id="boton-multiplicacion">Multiplicar</button>
                <button type="button" id="boton-division">Dividir</button>
            </div>

            <div class="grupo-formulario resultado">
                <label for="resultado">Resultado</label>
                <input type="text" id="resultado" readonly>
            </div>

        </form>
    </div>

    <script src="js/ejercicio16.js"></script>
</body>
</html>
