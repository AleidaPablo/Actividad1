<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Tareas</title>
    <link rel="stylesheet" href="css/ejercicio17.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <div class="contenedor">
        <h2>Gestión de Tareas</h2>

        <div class="grupo-formulario">
            <label for="tarea">Nueva tarea</label>
            <input type="text" id="tarea" placeholder="Escribe una tarea" autocomplete="off">
        </div>

        <button type="button" id="boton-agregar">Agregar Tarea</button>

        <div class="lista-tareas">
            <h3>Tareas pendientes</h3>
            <div id="lista"></div>
        </div>
    </div>

    <script src="js/ejercicio17.js"></script>
</body>
</html>
