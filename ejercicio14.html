<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcular Números</title>

    <link rel="stylesheet" href="css/ejercicio14.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <div class="calculadora">
        <h2>Calcular Números</h2>
        <form id="formularioNumeros" onsubmit="return false;">
            <div class="grupo-formulario">
                <label for="numeros">Ingresar números</label>
                <input  type="text"  id="numeros"  placeholder="Ejemplo: 10, 20, 30, 40"  autocomplete="off">
                <span id="error" class="mensaje-error"> Por favor ingrese números válidos separados por comas.</span>
             </div>
            <button  type="button"  id="boton-calcular"  class="boton-calcular">  Calcular</button>
            <div class="grupo-formulario margen-resultado">
                <label for="mayor">Número mayor</label>
                <input type="text" id="mayor" readonly>
            </div>
            <div class="grupo-formulario">
                <label for="menor">Número menor</label>
                <input type="text" id="menor" readonly>
            </div>
            <div class="grupo-formulario">
                <label for="promedio">Promedio</label>
                <input type="text" id="promedio" readonly>
            </div>
        </form>
    </div>
    <script src="js/ejercicio14.js"></script>
</body>
</html>
